<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yerevan Store | Contact Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0b0f1a; color: white; scroll-behavior: smooth; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .admin-section { display: none; }
        .is-admin .admin-section { display: block; }
        .old-price { text-decoration: line-through; color: #64748b; font-size: 0.9em; }
    </style>
</head>
<body class="pb-32">

    <header class="fixed top-0 w-full z-50 glass py-4 px-6 flex justify-between items-center">
        <div class="text-2xl font-black tracking-tighter text-blue-500 uppercase italic">Yerevan<span class="text-white">Store</span></div>
        <div id="header-auth">
            <button onclick="openLogin()" class="text-[10px] font-bold tracking-widest uppercase opacity-50 hover:opacity-100">Portal</button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 pt-32">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    </main>

    <div id="order-modal" class="fixed inset-0 bg-black/95 z-[110] hidden items-center justify-center p-6 backdrop-blur-md">
        <div class="glass p-8 rounded-[40px] max-w-sm w-full text-center border-blue-500/20 shadow-2xl">
            <h2 class="text-xl font-black mb-2 uppercase">Պատվիրել</h2>
            <p id="order-product-name" class="text-blue-400 mb-8 font-bold"></p>
            <div class="flex flex-col gap-3">
                <a id="link-ws" href="#" target="_blank" class="bg-[#25D366] py-4 rounded-2xl font-bold uppercase hover:scale-105 transition">WhatsApp</a>
                <a id="link-vb" href="#" target="_blank" class="bg-[#7360f2] py-4 rounded-2xl font-bold uppercase hover:scale-105 transition">Viber</a>
                <a id="link-call" href="#" class="bg-white text-black py-4 rounded-2xl font-bold uppercase hover:scale-105 transition">Զանգահարել</a>
            </div>
            <button onclick="closeOrder()" class="mt-6 text-gray-500 text-xs uppercase underline">Փակել</button>
        </div>
    </div>

    <div class="admin-section fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] w-full max-w-4xl px-4">
        <div id="add-btn-container" class="flex justify-center gap-4">
            <button onclick="showForm('product')" class="bg-blue-600 text-white px-6 py-4 rounded-2xl font-black uppercase text-xs shadow-xl active:scale-95 transition-all">+ Ապրանք</button>
            <button onclick="showForm('settings')" class="bg-white/10 text-white px-6 py-4 rounded-2xl font-black uppercase text-xs shadow-xl active:scale-95 transition-all">⚙️ Կոնտակտներ</button>
        </div>

        <div id="admin-form-product" class="hidden glass rounded-[35px] p-8 mt-4 border-blue-500/30">
            <h2 id="form-title" class="text-xl font-extrabold uppercase text-blue-400 mb-6">Ապրանքի Տվյալներ</h2>
            <input type="hidden" id="edit-id">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <input type="text" id="p-name" placeholder="Անուն" class="bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
                <input type="text" id="p-cat" placeholder="Տեսակը" class="bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
                <input type="number" id="p-price" placeholder="Գինը" class="bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
                <input type="number" id="p-sale" placeholder="Զեղչված գին" class="bg-white/5 border border-white/10 p-4 rounded-xl outline-none text-green-400 font-bold">
                <input type="text" id="p-img" placeholder="Նկարի հղում (URL)" class="w-full md:col-span-2 bg-white/5 border border-white/10 p-4 rounded-xl outline-none">
            </div>
            <div class="mt-6 flex gap-3">
                <button onclick="saveProduct()" class="flex-1 bg-blue-600 py-4 rounded-xl font-black uppercase">Պահպանել</button>
                <button onclick="hideForms()" class="bg-white/10 px-6 rounded-xl font-bold uppercase">X</button>
            </div>
        </div>

        <div id="admin-form-settings" class="hidden glass rounded-[35px] p-8 mt-4 border-white/20">
            <h2 class="text-xl font-extrabold uppercase text-white mb-6">Կոնտակտների Կառավարում</h2>
            <div class="space-y-4">
                <div class="flex items-center gap-3">
                    <span class="w-24 text-[10px] font-bold text-green-500 uppercase">WhatsApp:</span>
                    <input type="text" id="set-ws" placeholder="374XXXXXXXX" class="flex-1 bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-green-500">
                </div>
                <div class="flex items-center gap-3">
                    <span class="w-24 text-[10px] font-bold text-purple-500 uppercase">Viber:</span>
                    <input type="text" id="set-vb" placeholder="374XXXXXXXX" class="flex-1 bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-purple-500">
                </div>
                <div class="flex items-center gap-3">
                    <span class="w-24 text-[10px] font-bold text-white uppercase">Call:</span>
                    <input type="text" id="set-call" placeholder="374XXXXXXXX" class="flex-1 bg-white/5 border border-white/10 p-3 rounded-xl outline-none focus:border-white">
                </div>
            </div>
            <div class="mt-8 flex gap-3">
                <button onclick="saveSettings()" class="flex-1 bg-blue-600 py-4 rounded-xl font-black uppercase text-xs tracking-widest">Պահպանել Բոլորը</button>
                <button onclick="hideForms()" class="bg-white/10 px-6 rounded-xl font-bold uppercase">X</button>
            </div>
        </div>
    </div>

    <div id="login-modal" class="fixed inset-0 bg-black/95 z-[100] hidden items-center justify-center p-6 backdrop-blur-md">
        <div class="glass p-10 rounded-[40px] max-w-sm w-full">
            <input type="password" id="pass" placeholder="Գաղտնաբառ" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl mb-4 text-center text-xl outline-none">
            <button onclick="login()" class="w-full bg-blue-600 py-4 rounded-2xl font-bold uppercase transition">Մուտք</button>
            <button onclick="closeLogin()" class="w-full mt-4 text-gray-500 text-[10px] uppercase text-center">Փակել</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBQfUwdyV1G7zYJ5LMM8o9be0Qt2b08Cs8",
            authDomain: "yerevan-store.firebaseapp.com",
            projectId: "yerevan-store",
            storageBucket: "yerevan-store.firebasestorage.app",
            messagingSenderId: "400884279906",
            appId: "1:400884279906:web:2c8ec504f6002be6c33f3b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const colRef = collection(db, "products");
        let contacts = { ws: "37400000000", vb: "37400000000", call: "37400000000" };

        // LOAD SETTINGS
        onSnapshot(doc(db, "settings", "contact"), (doc) => {
            if (doc.exists()) {
                contacts = doc.data();
                document.getElementById('set-ws').value = contacts.ws || "";
                document.getElementById('set-vb').value = contacts.vb || "";
                document.getElementById('set-call').value = contacts.call || "";
            }
        });

        // RENDER PRODUCTS
        onSnapshot(colRef, (snapshot) => {
            const grid = document.getElementById('product-grid');
            const isAdmin = sessionStorage.getItem('is_admin') === 'true';
            document.body.classList.toggle('is-admin', isAdmin);
            if(isAdmin) document.getElementById('header-auth').innerHTML = `<button onclick="logout()" class="text-[10px] font-black uppercase text-red-500 border border-red-500/30 px-4 py-2 rounded-full">Ելք (Admin)</button>`;

            grid.innerHTML = snapshot.docs.map(d => {
                const p = d.data();
                const hasSale = p.sale && p.sale > 0;
                return `
                    <div class="glass rounded-[40px] p-4 group">
                        <div class="h-72 rounded-[30px] overflow-hidden mb-4 bg-gray-900">
                            <img src="${p.image}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                        </div>
                        <div class="px-2 text-center sm:text-left">
                            <span class="text-blue-500 text-[10px] font-black uppercase italic">${p.category}</span>
                            <h3 class="text-lg font-bold">${p.name}</h3>
                            <div class="mt-4 flex items-center justify-center sm:justify-start gap-3">
                                <span class="text-2xl font-black">${(hasSale ? p.sale : p.price).toLocaleString()} ֏</span>
                                ${hasSale ? `<span class="old-price">${p.price.toLocaleString()} ֏</span>` : ''}
                            </div>
                            <button onclick="openOrder('${p.name}')" class="w-full mt-6 bg-white text-black py-4 rounded-2xl font-black uppercase text-[10px] tracking-widest hover:bg-blue-600 hover:text-white transition shadow-lg">Պատվիրել</button>
                        </div>
                        ${isAdmin ? `
                            <div class="flex gap-2 mt-4 pt-4 border-t border-white/10">
                                <button onclick="window.editMode('${d.id}', '${p.name}', ${p.price}, ${p.sale || 0}, '${p.image}', '${p.category}')" class="flex-1 text-[10px] font-bold uppercase opacity-40 hover:opacity-100 transition">Խմբագրել</button>
                                <button onclick="window.deleteItem('${d.id}')" class="text-[10px] font-bold uppercase text-red-500 opacity-40 hover:opacity-100 transition">Ջնջել</button>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        });

        // SETTINGS SAVE
        window.saveSettings = async () => {
            const data = {
                ws: document.getElementById('set-ws').value,
                vb: document.getElementById('set-vb').value,
                call: document.getElementById('set-call').value
            };
            await setDoc(doc(db, "settings", "contact"), data);
            alert("Կոնտակտները թարմացվեցին:");
            hideForms();
        };

        // ORDER LOGIC
        window.openOrder = (name) => {
            document.getElementById('order-product-name').innerText = name;
            const text = encodeURIComponent(`Բարև ձեզ, ես ցանկանում եմ պատվիրել ${name} ապրանքը:`);
            document.getElementById('link-ws').href = `https://wa.me/${contacts.ws}?text=${text}`;
            document.getElementById('link-vb').href = `viber://chat?number=${contacts.vb}&draft=${text}`;
            document.getElementById('link-call').href = `tel:+${contacts.call}`;
            document.getElementById('order-modal').classList.remove('hidden');
        };
        window.closeOrder = () => document.getElementById('order-modal').classList.add('hidden');

        // PRODUCT ACTIONS
        window.saveProduct = async () => {
            const id = document.getElementById('edit-id').value;
            const data = {
                name: document.getElementById('p-name').value,
                category: document.getElementById('p-cat').value,
                price: parseInt(document.getElementById('p-price').value),
                sale: parseInt(document.getElementById('p-sale').value) || 0,
                image: document.getElementById('p-img').value
            };
            if(id) await updateDoc(doc(db, "products", id), data);
            else await addDoc(colRef, data);
            hideForms();
        };

        window.deleteItem = async (id) => { if(confirm("Ջնջե՞լ:")) await deleteDoc(doc(db, "products", id)); };
        
        window.editMode = (id, name, price, sale, img, cat) => {
            document.getElementById('edit-id').value = id;
            document.getElementById('p-name').value = name;
            document.getElementById('p-cat').value = cat;
            document.getElementById('p-price').value = price;
            document.getElementById('p-sale').value = sale;
            document.getElementById('p-img').value = img;
            showForm('product');
        };

        window.showForm = (type) => {
            hideForms();
            document.getElementById(`admin-form-${type}`).classList.remove('hidden');
            document.getElementById('add-btn-container').classList.add('hidden');
        };

        window.hideForms = () => {
            document.getElementById('admin-form-product').classList.add('hidden');
            document.getElementById('admin-form-settings').classList.add('hidden');
            document.getElementById('add-btn-container').classList.remove('hidden');
            document.getElementById('edit-id').value = "";
        };
        
        window.login = () => { if(document.getElementById('pass').value === "1234") { sessionStorage.setItem('is_admin', 'true'); location.reload(); } };
        window.logout = () => { sessionStorage.clear(); location.reload(); };
        window.openLogin = () => document.getElementById('login-modal').classList.remove('hidden');
        window.closeLogin = () => document.getElementById('login-modal').classList.add('hidden');
    </script>
</body>
</html>
